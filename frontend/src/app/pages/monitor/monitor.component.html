<button nbButton (click)="download()">Descargar CSV</button>
<p></p>
<div class="row">
  <div class="col-xxxl-6 col-md-6" *ngFor="let statusCard of statusCards">
    <ngx-status-card
      [title]="statusCard.title"
      [type]="statusCard.type"
      [id]="statusCard.id"
      (onClick)="setActuator($event)"
    >
      <i [ngClass]="statusCard.iconClass"></i>
    </ngx-status-card>
  </div>
</div>
<div class="row">
  <div class="col-xxl-12">
    <ngx-temperature-card></ngx-temperature-card>
  </div>
</div>
<div class="row">
  <div class="col-xxl-12">
    <ngx-humidity-card></ngx-humidity-card>
  </div>
</div>
<div class="row">
  <div class="col-xxl-12">
    <ngx-temperature-b-card></ngx-temperature-b-card>
  </div>
</div>
<div class="row">
  <div class="col-xxl-12">
    <ngx-soil-moisture-card></ngx-soil-moisture-card>
  </div>
</div>
<div class="row">
  <div class="col-xxl-12">
    <ngx-quality-card></ngx-quality-card>
  </div>
</div>
