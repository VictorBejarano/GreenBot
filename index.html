<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
  </head>
  <body>
    <h1>Recibiendo datos del Bluetooth</h1>
    <div id="data-container"></div>

    <script>
      // Conexión al servidor Socket.IO
      const socket = io("http://192.168.10.3:5000", {
        reconnection: true,
        reconnectionAttempts: Infinity, // Intentos infinitos
        reconnectionDelay: 1000, // Retraso entre intentos
        reconnectionDelayMax: 5000, // Retraso máximo
        pingInterval: 10000, // Intervalo de ping en ms
        pingTimeout: 5000, // Tiempo de espera para recibir el pong
      }); // Asegúrate de que la IP es correcta

      // Escuchar el evento 'data_update' enviado desde el servidor
      socket.on("data_update", function (data) {
        // Aquí actualizas el DOM con los datos recibidos
        const dataContainer = document.getElementById("data-container");
        const newData = document.createElement("p");
        newData.textContent = data.data;
        dataContainer.appendChild(newData);
      });

      // Si deseas manejar la conexión y emitir mensajes
      socket.on("connect", function () {
        console.log("Conectado al servidor");
        socket.emit("start_bluetooth_stream", ""); // Inicia el stream de Bluetooth
      });

      socket.on("disconnect", function () {
        console.log("Desconectado del servidor");
      });
    </script>
  </body>
</html>
